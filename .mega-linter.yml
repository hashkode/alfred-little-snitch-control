# MegaLinter configuration — https://megalinter.io
#
# Deliberately a whitelist. Three things about this repository are worth knowing
# before adding linters:
#
#   * The shell here is zsh, and shellcheck/shfmt do not support zsh — they
#     reject it outright rather than degrading. So no shell linter runs, and
#     `zsh -n` over every zsh file is part of tests/run.zsh instead.
#   * workflow/info.plist is XML, but validating it needs Apple's DTD; it is
#     checked with `plutil -lint` in tests/run.zsh and scripts/build.zsh.
#   * Secret scanning is a separate gitleaks step in .github/workflows/ci.yml.
#     No MegaLinter flavor ships REPOSITORY_GITLEAKS -- verified against v10's
#     flavor manifest, all 18 of them. The cupcake flavor does carry three other
#     secret scanners, and all three were measured against a fixture holding an
#     RSA private key, an AWS access key id and an AWS secret key:
#
#         gitleaks     3/3
#         betterleaks  2/3   missed the AWS secret key
#         secretlint   2/3   missed the AWS access key id
#         trufflehog   0/3   MegaLinter runs it with --only-verified, so it
#                            reports only credentials it can validate live
#
#     betterleaks and secretlint also scan `fs.content` -- the working tree --
#     while gitleaks scans git history, so a secret committed and later deleted
#     stays visible to gitleaks alone. None of the three is a replacement.

APPLY_FIXES: none

# MegaLinter treats formatter findings as non-blocking by default, so
# MARKDOWN_MARKDOWNLINT and PYTHON_RUFF_FORMAT could report errors while the
# job still concluded success -- and this job is a required check. Observed on
# a real run: three markdownlint errors in CHANGELOG.md, "Successfully linted
# all files, but with ignored errors", check run green.
FORMATTERS_DISABLE_ERRORS: false

# Without this, MegaLinter assumes black's style and silently skips
# PYTHON_RUFF_FORMAT even when it is listed in ENABLE_LINTERS.
PYTHON_DEFAULT_STYLE: ruff

SHOW_ELAPSED_TIME: true
PRINT_ALPACA: false
FAIL_IF_MISSING_LINTER_IN_FLAVOR: true

ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF
  - PYTHON_RUFF_FORMAT
  - SPELL_CSPELL
  - YAML_YAMLLINT

FILTER_REGEX_EXCLUDE: '(^|/)(dist|docs/images)/'

MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.yaml
YAML_YAMLLINT_CONFIG_FILE: .yamllint.yml
PYTHON_RUFF_CONFIG_FILE: ruff.toml
PYTHON_RUFF_FORMAT_CONFIG_FILE: ruff.toml

# Spell checking is worth it for documentation, where a typo is user-facing.
# Running it over zsh and AppleScript would be mostly noise.
SPELL_CSPELL_FILE_EXTENSIONS:
  - .md
SPELL_CSPELL_CONFIG_FILE: .cspell.json
