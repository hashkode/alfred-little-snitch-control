name: Release

on:
  push:
    tags: ['v*.*.*']
  # A rehearsal of the release path against any ref: the gate, the build, the
  # package check and the hand-off to the publish job, but never the
  # attestation or the release. A v* tag is permanent here
  # (release-tag-immutability has no bypass), so this is how the path is
  # exercised without spending one.
  workflow_dispatch:

# Nothing by default. Each job asks for what it uses.
permissions: {}

jobs:
  # Runs the repository's own scripts, so it gets a read-only token: a
  # compromised build step can neither write to the repository nor mint a
  # signing identity.
  build:
    name: Build
    runs-on: macos-latest
    # The release gate waits up to 10 minutes for CI still running on the commit.
    timeout-minutes: 30
    permissions:
      contents: read
      # The release gate reads the commit's check runs and its CI workflow runs.
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is built: the commit must be on main and must already
      # have passed ci-required, the check every merge to main requires.
      - name: Commit is on main and passed ci-required
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-gate.zsh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      # Fail before building if the tag and info.plist disagree.
      - name: Tag matches the source tree
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :version' workflow/info.plist)
          # A rehearsal runs from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "refs/tags/v$version" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match info.plist version $version" >&2
            exit 1
          fi

      # The release body is this version's CHANGELOG.md section. GitHub's
      # generated notes list the pull requests merged between two tags and
      # silently drop any commit whose pull request it cannot find: for v0.3.0
      # they held 9 of 17 changes (#49). The script fails on a missing, empty
      # or implausibly small section, so a bad extraction stops the run here.
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :version' workflow/info.plist)
          mkdir -p dist
          ./scripts/release-notes.zsh "$version" "$GITHUB_REPOSITORY" > dist/release-notes.md
          echo "Release notes: $(wc -c < dist/release-notes.md) bytes, $(grep -c '^- ' dist/release-notes.md) entries"
          head -n 12 dist/release-notes.md

      - name: Test, build, and validate
        run: make all

      # scripts/build.zsh names an archive for the release only when the
      # checkout is clean and tagged v<version>. If it did not recognise this
      # tag, the asset would be published under a development name.
      - name: Archive is named for the tag
        if: github.ref_type == 'tag'
        run: test -f "dist/Little-Snitch-Control-${GITHUB_REF_NAME}.alfredworkflow"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: |
            dist/*.alfredworkflow
            dist/*.alfredworkflow.sha256
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  # Holds the write, signing and attestation permissions, and runs none of the
  # repository's scripts: no checkout, only pinned actions and the checks
  # below. It runs in a rehearsal too, so the hand-off is exercised before a
  # tag depends on it; only the attestation and the release are tag-only.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: dist

      # The attestation must cover exactly the bytes the build job built and
      # validated. The checksum written next to them on the build runner is
      # the link between the two jobs.
      - name: Archive matches the checksum it was built with
        working-directory: dist
        run: |
          set -- *.alfredworkflow
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one archive, found: $*" >&2
            exit 1
          fi
          sha256sum --check --strict "$1.sha256"
          test -s release-notes.md

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/*.alfredworkflow

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.alfredworkflow
            dist/*.alfredworkflow.sha256
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
