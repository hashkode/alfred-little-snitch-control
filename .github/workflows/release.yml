name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail before building if the tag, info.plist and CHANGELOG disagree.
      - name: Tag matches the source tree
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :version' workflow/info.plist)
          if [ "refs/tags/v$version" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match info.plist version $version" >&2
            exit 1
          fi
          if ! grep -q "^## $version" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Test, build, and validate
        run: make all

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.alfredworkflow

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.alfredworkflow
            dist/*.alfredworkflow.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
