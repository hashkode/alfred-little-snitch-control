name: Release

on:
  push:
    tags: ['v*.*.*']
  # A rehearsal of the release path against any ref: the gate, the build and
  # the package check, but never the attestation or the release. A v* tag is
  # permanent here (release-tag-immutability has no bypass), so this is how the
  # path is exercised without spending one.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  # The release gate reads the commit's check runs and its CI workflow runs.
  checks: read
  actions: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    # The release gate waits up to 10 minutes for CI still running on the commit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything is built: the commit must be on main and must already
      # have passed ci-required, the check every merge to main requires.
      - name: Commit is on main and passed ci-required
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-gate.zsh "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      # Fail before building if the tag and info.plist disagree.
      - name: Tag matches the source tree
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :version' workflow/info.plist)
          # A rehearsal runs from a branch, so there is no tag to compare.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "refs/tags/v$version" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match info.plist version $version" >&2
            exit 1
          fi

      # The release body is this version's CHANGELOG.md section. GitHub's
      # generated notes list the pull requests merged between two tags and
      # silently drop any commit whose pull request it cannot find: for v0.3.0
      # they held 9 of 17 changes (#49). The script fails on a missing, empty
      # or implausibly small section, so a bad extraction stops the run here.
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :version' workflow/info.plist)
          mkdir -p dist
          ./scripts/release-notes.zsh "$version" "$GITHUB_REPOSITORY" > dist/release-notes.md
          echo "Release notes: $(wc -c < dist/release-notes.md) bytes, $(grep -c '^- ' dist/release-notes.md) entries"
          head -n 12 dist/release-notes.md

      - name: Test, build, and validate
        run: make all

      # scripts/build.zsh names an archive for the release only when the
      # checkout is clean and tagged v<version>. If it did not recognise this
      # tag, the asset would be published under a development name.
      - name: Archive is named for the tag
        if: github.ref_type == 'tag'
        run: test -f "dist/Little-Snitch-Control-${GITHUB_REF_NAME}.alfredworkflow"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: dist/*.alfredworkflow

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/*.alfredworkflow
            dist/*.alfredworkflow.sha256
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
