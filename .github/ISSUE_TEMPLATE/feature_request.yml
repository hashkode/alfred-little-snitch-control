name: Feature request
description: Suggest a change or addition.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please read the Roadmap and Security sections first. Some things are
        deliberately excluded: passwordless `sudo`, privileged helpers, UI
        scripting, auto-updates, and free-form text crossing the privileged
        boundary.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task, not the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: privileged
    attributes:
      label: Does this need anything new to run as root?
      description: If yes, describe what and why. This shapes whether it is feasible.
    validations:
      required: false
